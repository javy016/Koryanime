<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="icon" type="image/png" href="../Imagenes/logos/icono.png">
</head>

<body>

    <header class="cabecera-principal">
        <div class="contenedor-cabecera">
            <div class="contenedor-logotipo">
                <a href="../index.html">
                    <img id="logotipo-koryanime" src="../Imagenes/logos/logo_oscuro.png" alt="Logotipo de Koryanime"
                        style="height: 28px;">
                </a>
            </div>

            <form class="contenedor-busqueda" action="catalogo.html" method="GET">
                <i class="ph ph-magnifying-glass icono-busqueda"></i>
                <input type="text" name="buscar" placeholder="Buscar anime..." class="escribir-Busqueda">
                <button type="button" id="boton-alternar-filtros" class="boton-filtros">
                    <i class="ph ph-faders"></i> Filtros
                </button>
            </form>

            <nav class="navegacion-cabecera">
                <a href="#" class="enlace-navegacion"><i class="ph ph-discord-logo" style="color: #5865F2;"></i>
                    Discord</a>
                <a href="#" class="enlace-navegacion"><i class="ph ph-calendar-blank"></i> Horario</a>
                <a href="catalogo.html" class="enlace-navegacion"><i class="ph ph-books"></i> Catálogo de animes</a>

                <button class="boton-icono" aria-label="Notificaciones"><i class="ph ph-bell"></i></button>

                <button id="alternar-tema" class="boton-icono" aria-label="Cambiar tema">
                    <i id="icono-sol" class="ph ph-sun icono-tema activo"></i>
                    <i id="icono-luna" class="ph ph-moon icono-tema"></i>
                </button>
                <div class="contenedor-menu-usuario">
                    <button id="boton-usuario" class="perfil-usuario">
                        <div id="contenido-desplegable-usuario">
                            <i class="ph ph-user" style="font-size: 20px;"></i>
                        </div>
                    </button>

                    <div id="desplegable-usuario" class="desplegable-usuario">
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="contenido-principal">
        <div class="cabecera-seccion" style="margin-top: 2rem; margin-bottom: 1.5rem;">
            <h2 id="titulo-catalogo">Catálogo de Animes</h2>
        </div>

        <div id="panel-filtros" class="panel-filtros oculto">

            <!-- Barra de Búsqueda por Letra -->
            <div class="filtro-alfabetico" id="filtro-alfabetico">
                <button class="boton-letra activo" data-letra="all">#</button>
                <button class="boton-letra" data-letra="A">A</button>
                <button class="boton-letra" data-letra="B">B</button>
                <button class="boton-letra" data-letra="C">C</button>
                <button class="boton-letra" data-letra="D">D</button>
                <button class="boton-letra" data-letra="E">E</button>
                <button class="boton-letra" data-letra="F">F</button>
                <button class="boton-letra" data-letra="G">G</button>
                <button class="boton-letra" data-letra="H">H</button>
                <button class="boton-letra" data-letra="I">I</button>
                <button class="boton-letra" data-letra="J">J</button>
                <button class="boton-letra" data-letra="K">K</button>
                <button class="boton-letra" data-letra="L">L</button>
                <button class="boton-letra" data-letra="M">M</button>
                <button class="boton-letra" data-letra="N">N</button>
                <button class="boton-letra" data-letra="O">O</button>
                <button class="boton-letra" data-letra="P">P</button>
                <button class="boton-letra" data-letra="Q">Q</button>
                <button class="boton-letra" data-letra="R">R</button>
                <button class="boton-letra" data-letra="S">S</button>
                <button class="boton-letra" data-letra="T">T</button>
                <button class="boton-letra" data-letra="U">U</button>
                <button class="boton-letra" data-letra="V">V</button>
                <button class="boton-letra" data-letra="W">W</button>
                <button class="boton-letra" data-letra="X">X</button>
                <button class="boton-letra" data-letra="Y">Y</button>
                <button class="boton-letra" data-letra="Z">Z</button>
            </div>

            <!-- Filtros Desplegables -->
            <div class="filtros-avanzados">
                <select id="filtro-tipo" class="selector-filtro">
                    <option value="">Tipo: Seleccionar</option>
                    <option value="TV Anime">TV Anime</option>
                    <option value="Película">Película</option>
                    <option value="OVA">OVA</option>
                </select>

                <select id="filtro-genero" class="selector-filtro">
                    <option value="">Género: Seleccionar</option>
                    <option value="Acción">Acción</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Comedia">Comedia</option>
                    <option value="Drama">Drama</option>
                    <option value="Fantasía">Fantasía</option>
                    <option value="Sobrenatural">Sobrenatural</option>
                </select>

                <select id="filtro-anio" class="selector-filtro">
                    <option value="">Año: Seleccionar</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                </select>

                <select id="filtro-estado" class="selector-filtro">
                    <option value="">Estado: Seleccionar</option>
                    <option value="En emisión">En emisión</option>
                    <option value="Finalizado">Finalizado</option>
                    <option value="Próximamente">Próximamente</option>
                </select>

                <button id="aplicar-filtros" class="boton-aplicar-filtros">Filtrar</button>
            </div>
        </div>

        <!-- Resultados y Orden -->
        <div class="cabecera-resultados">
            <span id="cantidad-resultados">0 Resultados</span>
            <div class="contenedor-ordenacion">
                <span>Ordenar por:</span>
                <select id="orden-resultados" class="selector-ordenacion">
                    <option value="default">Predeterminado</option>
                    <option value="rating">Mejor puntuados</option>
                    <option value="year">Más recientes</option>
                </select>
            </div>
        </div>

        <!-- series -->
        <div class="celda-animes" id="celdas-catalogo"></div>
    </main>

    <script src="../js/tema.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/catalogo.js"></script>
</body>

</html>
