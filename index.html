<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koryanime</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="icon" type="image/png" href="./Imagenes/logos/icono.png">

</head>

<body>

    <header class="cabecera-principal">
        <div class="contenedor-cabecera">
            <div class="contenedor-logotipo">
                <a href="index.html">
                    <img id="logotipo-koryanime" src="./Imagenes/logos/logo_oscuro.png" alt="Logotipo de Koryanime"
                        style="height: 28px;">
                </a>
            </div>

            <form class="contenedor-busqueda" action="webs/catalogo.html" method="GET">
                <i class="ph ph-magnifying-glass icono-busqueda"></i>
                <input type="text" name="buscar" placeholder="Buscar anime..." class="escribir-Busqueda">
                <a href="webs/catalogo?filtros=abiertos" class="boton-filtros" style="text-decoration: none;">
                    <i class="ph ph-faders"></i> Filtros
                </a>
            </form>

            <nav class="navegacion-cabecera">
                <a href="#" class="enlace-navegacion"><i class="ph ph-discord-logo" style="color: #5865F2;"></i>
                    Discord</a>
                <a href="#" class="enlace-navegacion"><i class="ph ph-calendar-blank"></i> Horario</a>
                <a href="webs/catalogo.html" class="enlace-navegacion"><i class="ph ph-books"></i> Catálogo de
                    animes</a>

                <button class="boton-icono" aria-label="Notificaciones"><i class="ph ph-bell"></i></button>

                <button id="alternar-tema" class="boton-icono" aria-label="Cambiar tema">
                    <i id="icono-sol" class="ph ph-sun icono-tema activo"></i>
                    <i id="icono-luna" class="ph ph-moon icono-tema"></i>
                </button>

                <div class="contenedor-menu-usuario">
                    <button id="boton-usuario" class="perfil-usuario">
                        <div id="contenido-desplegable-usuario">
                            <i class="ph ph-user" style="font-size: 20px;"></i>
                        </div>
                    </button>

                    <div id="desplegable-usuario" class="desplegable-usuario">
                        <!-- JS mostrará aquí el contenido -->
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="contenido-principal">
        <section class="seccion-portada">
            <div class="carrusel-portada" id="carrusel-portada"></div>
            <button class="boton-carrusel anterior" id="btn-prev">❮</button>
            <button class="boton-carrusel siguiente" id="btn-next">❯</button>
        </section>

        <section class="trending-section">
            <div class="cabecera-seccion">
                <h2>Tendencias</h2>
                <a href="webs/catalogo.html" class="ver-todo">Ver todo →</a>
            </div>
            <div class="celda-animes" id="trending-grid"></div>
        </section>

        <section class="seccion-episodios-recientes">
            <div class="cabecera-seccion">
                <div>
                    <h2>Episodios</h2>
                    <p class="subtitulo">RECIENTEMENTE ACTUALIZADO</p>
                </div>
            </div>
            <div class="celda-episodios" id="recent-episodes-grid"></div>
        </section>
    </main>

    <script src="js/tema.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
