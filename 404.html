<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOT FOUND</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="icon" href="./imagenes/icono.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" type="image/png" href="./Imagenes/logos/icono.png">
    <style>
        /* Estilos de la página 404 */
        .error-404 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60vh;
            padding: 40px 20px;
        }

        .error-404 .codigo {
            font-size: 120px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-shadow: 4px 4px 0 var(--border-color);
        }

        .error-404 h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .error-404 p {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 500px;
        }

        .error-404 .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            padding: 14px 30px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.3s, opacity 0.3s;
        }

        .error-404 .btn-volver:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .error-404 .icono-404 {
            font-size: 60px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <!-- CABECERA-->
    <header class="cabecera-principal">
        <div class="contenedor-cabecera">
            <div class="contenedor-logotipo">
                <a href="index.html">
                    <img id="logotipo-koryanime" src="./Imagenes/logos/logo_oscuro.png" alt="Logotipo de Koryanime"
                        style="height: 28px;">
                </a>
            </div>

            <form class="contenedor-busqueda" action="webs/catalogo.html" method="GET">
                <i class="ph ph-magnifying-glass icono-busqueda"></i>
                <input type="text" name="buscar" placeholder="Buscar anime..." class="escribir-Busqueda">
                <a href="webs/catalogo?filtros=abiertos" class="boton-filtros" style="text-decoration: none;">
                    <i class="ph ph-faders"></i> Filtros
                </a>
            </form>

            <nav class="navegacion-cabecera">
                <a href="https://discord.gg/AZavtt5QSh" class="enlace-navegacion"><i class="ph ph-discord-logo" style="color: #5865F2;"></i>
                    Discord</a>
                <a href="#" class="enlace-navegacion"><i class="ph ph-calendar-blank"></i> Horario</a>
                <a href="webs/catalogo.html" class="enlace-navegacion"><i class="ph ph-books"></i> Catálogo de
                    animes</a>

                <button class="boton-icono" aria-label="Notificaciones"><i class="ph ph-bell"></i></button>

                <button id="alternar-tema" class="boton-icono" aria-label="Cambiar tema">
                    <i id="icono-sol" class="ph ph-sun icono-tema activo"></i>
                    <i id="icono-luna" class="ph ph-moon icono-tema"></i>
                </button>

                <div class="contenedor-menu-usuario">
                    <button id="boton-usuario" class="perfil-usuario">
                        <div id="contenido-desplegable-usuario">
                            <i class="ph ph-user" style="font-size: 20px;"></i>
                        </div>
                    </button>

                    <div id="desplegable-usuario" class="desplegable-usuario">
                        <!-- JS mostrará aquí el contenido -->
                    </div>
                </div>
            </nav>
        </div>
    </header>


    <!-- CONTENIDO DE LA PAGINA 404-->
    <main class="error-404">
        <div class="icono-404"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="codigo">404</div>
        <h1>Página no encontrada</h1>
        <p>Lo sentimos, la página que buscas no existe. Puede que hayas escrito mal la dirección o que el enlace haya
            sido reemplazado.</p>
        <a href="./index.html" class="btn-volver">
            <i class="fas fa-home"></i> Volver al inicio
        </a>
    </main>

    <footer class="pie-pagina">
        <a href="https://github.com/javy016/Koryanime" target="_blank" class="enlace-github">
            <i class="ph ph-github-logo"></i> Repositorio GitHub
        </a>

    </footer>

    <!-- SCRIPTS -->
    <script src="js/tema.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/carrito.js"></script>
</body>

</html>
