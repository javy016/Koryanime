<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOT FOUND</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="icon" href="./imagenes/icono.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Estilos de la página 404 */
        .error-404 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60vh;
            padding: 40px 20px;
        }

        .error-404 .codigo {
            font-size: 120px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-shadow: 4px 4px 0 var(--border-color); 
        }

        .error-404 h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .error-404 p {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 500px;
        }

        .error-404 .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            padding: 14px 30px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.3s, opacity 0.3s;
        }

        .error-404 .btn-volver:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .error-404 .icono-404 {
            font-size: 60px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <!-- CABECERA-->
  <header class="main-header">
        <div class="header-container">
            <div class="logo-container">
                <a href="index.html">
                    <img id="logo-koryanime" src="./Imagenes/logos/logo_oscuro.png" alt="Koryanime Logo" style="height: 28px;">
                </a>
            </div>

            <form class="search-container" action="webs/catalogo.html" method="GET">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" name="buscar" placeholder="Buscar anime..." class="search-input">
                <a href="webs/catalogo?filtros=abiertos" class="btn-filtros" style="text-decoration: none;">
                    <i class="ph ph-faders"></i> Filtros
                </a>
            </form>

            <nav class="header-nav">
                <a href="#" class="nav-link"><i class="ph ph-discord-logo" style="color: #5865F2;"></i> Discord</a>
                <a href="#" class="nav-link"><i class="ph ph-calendar-blank"></i> Horario</a>
                <a href="webs/catalogo.html" class="nav-link"><i class="ph ph-books"></i> Catalogo de Animes</a>

                <button class="icon-btn" aria-label="Notificaciones"><i class="ph ph-bell"></i></button>

                <button id="theme-toggle" class="icon-btn" aria-label="Cambiar tema">
                    <i id="icon-sun" class="ph ph-sun theme-icon active"></i>
                    <i id="icon-moon" class="ph ph-moon theme-icon"></i>
                </button>

                <!-- MENÚ DE USUARIO DINÁMICO -->
                <div class="user-menu-container">
                    <button id="user-btn" class="user-profile">
                        <div id="user-dropdown-content">
                            <i class="ph ph-user" style="font-size: 20px;"></i>
                        </div>
                    </button>

                    <div id="user-dropdown-menu" class="user-dropdown">
                        <!-- JS inyectará aquí el contenido -->
                    </div>
                </div>
            </nav>
        </div>
    </header>


        <!-- CONTENIDO DE LA PAGINA 404-->
    <main class="error-404">
        <div class="icono-404"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="codigo">404</div>
        <h1>Página no encontrada</h1>
        <p>Lo sentimos, la página que buscas no existe. Puede que hayas escrito mal la dirección o que el enlace haya sido reemplazado.</p>
        <a href="./index.html" class="btn-volver">
            <i class="fas fa-home"></i> Volver al inicio
        </a>
    </main>

    

    <!-- SCRIPTS -->
    <script src="js/tema.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/carrito.js"></script>
</body>

</html>
